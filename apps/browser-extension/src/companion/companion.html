<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语伴</title>
  <link rel="stylesheet" href="companion.css">
</head>
<body>
  <div class="companion-container">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title">💬 语伴</h1>
      <span class="current-topic" id="currentTopic">选择一个话题开始聊天</span>
      <div class="header-actions">
        <label class="level-select-label" for="levelSelect">等级</label>
        <select id="levelSelect" class="level-select">
          <option value="A1">A1 初中入门</option>
          <option value="A2">A2 中考水平</option>
          <option value="B1">B1 高考水平</option>
          <option value="B2">B2 四六级</option>
          <option value="C1">C1 考研/专八</option>
          <option value="C2">C2 专业翻译</option>
        </select>
        <button id="ttsToggleBtn" class="icon-btn" title="AI 回复自动朗读开关">🔊</button>
        <button id="endChatBtn" class="btn-end" disabled>结束对话</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- 左侧栏：话题 / 历史 / 收藏 -->
      <aside class="sidebar">
        <section class="sidebar-section" id="topicsSection">
          <div class="section-header">
            <span class="section-label">推荐话题</span>
            <button id="refreshTopicsBtn" class="link-btn" title="AI 换一批话题">🔄 换一批</button>
          </div>
          <div id="topicsList" class="topics-list"></div>
          <div class="custom-topic">
            <input id="customTopicInput" class="custom-topic-input" type="text"
              placeholder="＋ 自定义话题（中/英文均可）" maxlength="50">
            <button id="customTopicBtn" class="btn-primary btn-small">开聊</button>
          </div>
        </section>

        <div class="panel-tabs">
          <button class="panel-tab active" data-panel="history">历史</button>
          <button class="panel-tab" data-panel="favorites">收藏</button>
        </div>
        <section class="sidebar-section panel-content" id="historyPanel">
          <div id="historyList" class="record-list"></div>
        </section>
        <section class="sidebar-section panel-content" id="favoritesPanel" style="display:none">
          <div id="favoritesList" class="record-list"></div>
        </section>

        <footer class="sidebar-footer">
          <button id="clearMemoryBtn" class="link-btn link-danger">清除语伴记忆</button>
        </footer>
      </aside>

      <!-- 聊天区 -->
      <main class="chat-area">
        <div id="messagesEl" class="messages">
          <div class="empty-state" id="emptyState">
            <div class="empty-emoji">😊</div>
            <p>我是 Echo，你的英语语伴。</p>
            <p class="empty-sub">从左侧挑一个话题，或者自己定一个——就像和老朋友聊天一样，随便聊。</p>
          </div>
        </div>

        <!-- 帮我说一句 提示卡 -->
        <div id="hintCard" class="hint-card" style="display:none">
          <div class="hint-card-header">
            <span>💡 可以这样说</span>
            <button id="hintCloseBtn" class="link-btn">收起</button>
          </div>
          <div id="hintList"></div>
        </div>

        <!-- 录音状态与实时识别 -->
        <div id="recordingStatus" class="recording-status" style="display:none">
          <span class="recording-dot"></span>
          <span>正在录音…</span>
          <span id="recordingTime" class="recording-time">00:00</span>
        </div>
        <div id="recognitionPreview" class="recognition-preview" style="display:none">
          <span class="preview-label">识别中：</span>
          <span id="recognitionText" class="preview-text"></span>
        </div>

        <div id="statusEl" class="status-message"></div>

        <!-- 输入区 -->
        <div class="input-area">
          <button id="hintBtn" class="btn-hint" title="卡壳了？给我两句示例" disabled>💡 帮我说一句</button>
          <input id="inputEl" class="chat-input" type="text"
            placeholder="输入英文，或点 🎤 说话…" maxlength="500" disabled>
          <button id="sendBtn" class="btn-primary" disabled>发送</button>
          <button id="micBtn" class="btn-mic" title="语音输入" disabled>
            <svg class="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <svg class="icon-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none">
              <rect x="6" y="6" width="12" height="12" rx="2"></rect>
            </svg>
          </button>
        </div>
      </main>
    </div>

    <!-- 生词点查弹窗 -->
    <div id="wordPopup" class="word-popup" style="display:none"></div>
  </div>
  <script type="module" src="companion.ts"></script>
</body>
</html>
