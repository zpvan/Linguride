name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev_rustify
    tags:
      - 'chrome-extension-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NPM_CONFIG_CACHE: ${{ github.workspace }}/infra_scripts/out/.npm-cache

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate (chrome-extension)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run validate gate
        run: bash infra_scripts/ci/github/test.sh chrome-extension

  package:
    name: package (chrome-extension)
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build package
        run: bash infra_scripts/ci/github/package.sh chrome-extension

      - name: Run smoke checks
        run: bash infra_scripts/ci/github/smoke.sh chrome-extension

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: infra_scripts/out/chrome-extension/
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (chrome-extension)
    if: startsWith(github.ref, 'refs/tags/chrome-extension-v')
    needs: package
    runs-on: ubuntu-latest

    # job 级 permissions 完全替换 workflow 级声明（未列出的 scope 变为 none），
    # 因此这里必须写全 contents: write；validate/package 不受影响。
    permissions:
      contents: write

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: infra_scripts/out/chrome-extension/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="$(find infra_scripts/out/chrome-extension -name '*.zip' -print -quit)"
          if [[ -z "$zip" ]]; then
            echo "::error::未找到打包产物 zip"
            exit 1
          fi
          # 幂等：tag 上已有 release 时只刷新 asset，不因 release 已存在而失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，刷新产物"
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" \
              --title "Lingride $TAG" \
              --generate-notes
          fi
