name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "bindings/mobile-core/**"
      - "crates/linguride-core/**"
      - "crates/linguride-domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-ci.yml"
      - "infra_scripts/lib/**"
      - "infra_scripts/ci/github/android-validate.sh"
  push:
    branches:
      - main
      - dev_rustify
    paths:
      - "apps/android/**"
      - "bindings/mobile-core/**"
      - "crates/linguride-core/**"
      - "crates/linguride-domain/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-ci.yml"
      - "infra_scripts/lib/**"
      - "infra_scripts/ci/github/android-validate.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate (android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Android SDK environment
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Run Android validate gate
        run: bash infra_scripts/ci/github/android-validate.sh

      - name: Upload Android test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            apps/android/**/build/reports
            apps/android/**/build/test-results
          if-no-files-found: warn
          retention-days: 14
