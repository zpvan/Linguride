[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/linguride-domain",
  "crates/linguride-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Linguride Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
