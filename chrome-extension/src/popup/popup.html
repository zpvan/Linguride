<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingride 设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="header">
      <h1 class="title">🌐 Lingride</h1>
      <label class="toggle-switch">
        <input type="checkbox" id="translationToggle">
        <span class="slider"></span>
      </label>
    </header>

    <!-- 配置未完成提示 -->
    <div id="configWarning" class="warning" style="display: none;">
      ⚠️ 请先配置 API Key 才能使用翻译功能
    </div>

    <!-- 翻译服务配置 -->
    <section class="section">
      <h2 class="section-title">翻译服务配置</h2>
      
      <div class="form-group">
        <label for="apiBaseUrl">API 端点 (Base URL)</label>
        <input type="text" id="apiBaseUrl" placeholder="https://api.deepseek.com">
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <div class="password-input">
          <input type="password" id="apiKey" placeholder="sk-...">
          <button type="button" id="showKeyBtn" class="show-key-btn">显示</button>
        </div>
      </div>

      <div class="form-group">
        <label for="modelSelect">模型</label>
        <select id="modelSelect">
          <option value="deepseek-chat">DeepSeek Chat</option>
          <option value="deepseek-coder">DeepSeek Coder</option>
          <option value="deepseek-reasoner">DeepSeek Reasoner</option>
          <option value="custom">自定义模型...</option>
        </select>
        <input type="text" id="customModel" class="custom-model-input" style="display: none;" placeholder="输入模型名称">
      </div>

      <button id="testConnectionBtn" class="btn btn-secondary">测试连接</button>
      <div id="connectionStatus" class="status-message"></div>
    </section>

    <!-- 难度分析 -->
    <section class="section">
      <h2 class="section-title">页面难度分析</h2>
      <p class="section-desc">快速评估当前页面的英文难度级别</p>
      
      <button id="analyzeDifficultyBtn" class="btn btn-analyze">
        <span class="btn-icon">📊</span>
        分析当前页面
      </button>
      
      <div id="difficultyStatus" class="status-message"></div>
      
      <!-- 分析结果卡片（初始隐藏） -->
      <div id="difficultyResult" class="difficulty-result" style="display: none;">
        <div class="result-header">
          <span id="difficultyBadge" class="difficulty-badge"></span>
          <span id="cefrBadge" class="cefr-badge"></span>
        </div>
        
        <div class="result-score">
          <div class="score-bar">
            <div id="scoreProgress" class="score-progress"></div>
          </div>
          <div class="score-labels">
            <span>简单</span>
            <span id="scoreValue" class="score-value">0</span>
            <span>困难</span>
          </div>
        </div>
        
        <div class="result-metrics">
          <div class="metric">
            <span class="metric-label">词汇复杂度</span>
            <span id="vocabMetric" class="metric-value">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">句子复杂度</span>
            <span id="sentenceMetric" class="metric-value">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">阅读时间</span>
            <span id="readingTime" class="metric-value">-</span>
          </div>
          <div class="metric">
            <span class="metric-label">采样词数</span>
            <span id="wordCount" class="metric-value">-</span>
          </div>
        </div>
        
        <div class="result-suggestions">
          <h4>📝 学习建议</h4>
          <ul id="suggestionsList"></ul>
        </div>
        
        <div id="selectionHint" class="selection-hint" style="display: none;">
          💡 分析基于选中文本
        </div>
      </div>
    </section>

    <!-- 高级设置 -->
    <div class="advanced-section">
      <button type="button" id="advancedToggle" class="advanced-toggle">
        <span class="toggle-icon">▶</span> 高级设置
      </button>
      <div id="advancedContent" class="advanced-content collapsed">
        <!-- 翻译 Prompt 配置 -->
        <h3 class="prompt-group-title">翻译 Prompt</h3>
        <div class="form-group">
          <label for="systemPrompt">System Prompt</label>
          <textarea id="systemPrompt" rows="5" placeholder="你是专业的英中翻译专家..."></textarea>
        </div>

        <div class="form-group">
          <label for="userPrompt">User Prompt 模板</label>
          <textarea id="userPrompt" rows="4" placeholder="请翻译以下英文文本..."></textarea>
          <p class="hint">💡 使用 <code>{{texts}}</code> 表示待翻译文本</p>
        </div>

        <!-- 难度分析 Prompt 配置 -->
        <h3 class="prompt-group-title">难度分析 Prompt</h3>
        <div class="form-group">
          <label for="difficultySystemPrompt">System Prompt</label>
          <textarea id="difficultySystemPrompt" rows="4" placeholder="你是一个专业的英文语言评估专家..."></textarea>
        </div>

        <div class="form-group">
          <label for="difficultyUserPrompt">User Prompt 模板</label>
          <textarea id="difficultyUserPrompt" rows="4" placeholder="请分析以下英文文本的难度..."></textarea>
          <p class="hint">💡 使用 <code>{text}</code> 表示待分析文本</p>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="resetDefaultsBtn" class="btn btn-text">恢复默认</button>
      <button id="saveSettingsBtn" class="btn btn-primary">保存设置</button>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
